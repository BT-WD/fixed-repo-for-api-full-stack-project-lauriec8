<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>API Full Stack Project</title>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <div class="game-container">
        <header class="game-header">
            <h1 class="title">TRIVIA SPACE!</h1>
            <div class="score-board">SCORE: <span id="score">10</span></div>
        </header>

        <main class="question-container">
            <h2 class="question-text">How many rings are on the Olympic flag?</h2>
        </main>

        <section class="answers-grid">
            <button class="answer-btn">None</button>
            <button class="answer-btn">Four</button>
            <button class="answer-btn">Five</button>
            <button class="answer-btn">Seven</button>
        </section>
    </div>

</body>
</html>
